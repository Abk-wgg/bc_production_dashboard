<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Production board">
  <!--
    The schedule in miniature: three work-centre columns of different heights.
    Kept to four solid shapes because the only size that matters is 16px in a
    browser tab, where anything finer turns to mush. The filled tile means it
    stays visible against a light or a dark tab strip.
  -->
  <rect width="32" height="32" rx="7" fill="#2f5d50"/>
  <rect x="7"  y="8"  width="5" height="16" rx="1.5" fill="#f0f0eb"/>
  <rect x="14" y="13" width="5" height="11" rx="1.5" fill="#f0f0eb" opacity="0.75"/>
  <rect x="21" y="17" width="5" height="7"  rx="1.5" fill="#f0f0eb" opacity="0.5"/>
</svg>
